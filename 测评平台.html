<title>人格测评平台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F3EF;--surface:#FFFFFF;--surface-2:#FBFAF7;--text:#2A2B2D;--text-2:#6E7078;--text-3:#A5A8AE;
  --border:#E2DFD9;--border-2:#EBE8E2;--accent:#3A7D6E;--accent-h:#2D6358;--accent-bg:rgba(58,125,110,.08);
  --shadow:0 1px 3px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);--shadow-sm:0 1px 3px rgba(0,0,0,.05);--r:14px;
  --c-trait:#5B6DAF;--c-self:#C9943E;--c-dark:#B5514A;--c-positive:#3A9B8A;--c-bio:#8B6BAD;
  --f0:#3A9B8A;--f1:#D96B55;--f2:#5B6DAF;--f3:#C9943E;--f4:#8B6BAD;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161719;--surface:#222326;--surface-2:#1D1E20;--text:#E5E3DF;--text-2:#9B9DA3;--text-3:#5F6167;
  --border:#35363B;--border-2:#2C2D31;--accent:#5CBFAB;--accent-h:#74D4C0;--accent-bg:rgba(92,191,171,.1);
  --shadow:0 1px 3px rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.18);--shadow-sm:0 1px 3px rgba(0,0,0,.2);
  --c-trait:#8B9DD4;--c-self:#DEB060;--c-dark:#E08A82;--c-positive:#5CC0AE;--c-bio:#B08FD4;
  --f0:#5CC0AE;--f1:#E8887A;--f2:#8B9DD4;--f3:#DEB060;--f4:#B08FD4;
}}
:root[data-theme="dark"]{
  --bg:#161719;--surface:#222326;--surface-2:#1D1E20;--text:#E5E3DF;--text-2:#9B9DA3;--text-3:#5F6167;
  --border:#35363B;--border-2:#2C2D31;--accent:#5CBFAB;--accent-h:#74D4C0;--accent-bg:rgba(92,191,171,.1);
  --shadow:0 1px 3px rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.18);--shadow-sm:0 1px 3px rgba(0,0,0,.2);
  --c-trait:#8B9DD4;--c-self:#DEB060;--c-dark:#E08A82;--c-positive:#5CC0AE;--c-bio:#B08FD4;
  --f0:#5CC0AE;--f1:#E8887A;--f2:#8B9DD4;--f3:#DEB060;--f4:#B08FD4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
.serif{font-family:'Source Serif 4','Georgia',serif}
.view{display:none}
.view.on{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}

/* ---------- Catalog ---------- */
.cat-header{text-align:center;padding:64px 24px 20px}
.cat-header h1{font-size:clamp(30px,6vw,44px);font-weight:700;line-height:1.12;letter-spacing:-.01em;margin-bottom:12px}
.cat-header p{font-size:15px;color:var(--text-2);max-width:520px;margin:0 auto}
.cat-note{font-size:13px;color:var(--text-3);margin-top:14px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:20px 0 140px}
.scard{position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);
  padding:20px 20px 18px;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .12s;
  display:flex;flex-direction:column;gap:8px}
.scard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.scard.sel{border-color:var(--accent);background:var(--accent-bg)}
.scard .chk{position:absolute;top:16px;right:16px;width:22px;height:22px;border:2px solid var(--border);
  border-radius:6px;transition:all .18s;display:flex;align-items:center;justify-content:center}
.scard.sel .chk{background:var(--accent);border-color:var(--accent)}
.scard .chk svg{width:13px;height:13px;stroke:#fff;stroke-width:3.5;opacity:0;transition:opacity .18s}
.scard.sel .chk svg{opacity:1}
.scard .cat-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;
  align-self:flex-start;letter-spacing:.02em}
.scard h3{font-size:17px;font-weight:600;line-height:1.3;padding-right:28px}
.scard .en{font-size:12px;color:var(--text-3);margin-top:-4px}
.scard .blurb{font-size:13px;color:var(--text-2);line-height:1.55;flex:1}
.scard .meta{display:flex;gap:14px;font-size:12px;color:var(--text-3);margin-top:4px;font-variant-numeric:tabular-nums}
.scard .meta b{color:var(--text-2);font-weight:600}

.dockbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
  box-shadow:0 -4px 20px rgba(0,0,0,.06);padding:14px 24px;z-index:50;
  display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.dock-info{font-size:14px;color:var(--text-2)}
.dock-info b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.dock-actions{display:flex;gap:10px;align-items:center}
.link-btn{background:none;border:none;color:var(--text-3);font-size:13px;cursor:pointer;padding:8px}
.link-btn:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 30px;background:var(--accent);
  color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
  transition:background .18s,transform .1s;font-family:inherit}
.btn:hover{background:var(--accent-h)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn.ghost:hover{background:var(--surface);border-color:var(--accent);color:var(--accent)}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:560px;margin:0 auto;padding:0 24px;min-height:100vh;display:flex;flex-direction:column}
.qbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:22px 0 0}
.qbar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.qbar-scale{font-size:13px;font-weight:600;color:var(--accent)}
.qbar-count{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ptrack{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:var(--accent);border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.seg-dots{display:flex;gap:4px;justify-content:center;padding:9px 0 2px}
.seg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background .3s}
.seg-dot.done{background:var(--accent)}
.seg-dot.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.item-area{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 0 40px}
.icard{text-align:center;width:100%;transition:opacity .2s,transform .2s}
.icard.mv{opacity:0;transform:translateX(26px)}
.icard.mvb{opacity:0;transform:translateX(-26px)}
.inum{display:inline-block;font-size:12px;font-weight:600;color:var(--text-3);background:var(--accent-bg);
  padding:2px 11px;border-radius:20px;margin-bottom:20px;font-variant-numeric:tabular-nums}
.izh{font-size:clamp(19px,4.4vw,24px);font-weight:500;line-height:1.45;margin-bottom:9px;text-wrap:balance}
.ien{font-size:13.5px;color:var(--text-3);margin-bottom:34px;font-style:italic;line-height:1.4}
.rrow{display:flex;gap:9px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.rbtn{min-width:50px;height:50px;padding:0 6px;border:1.5px solid var(--border);border-radius:11px;background:var(--surface);
  color:var(--text);font-size:16px;font-weight:600;cursor:pointer;transition:all .14s;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;font-family:inherit}
.rbtn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.rbtn.sel{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.06);
  box-shadow:0 4px 14px rgba(58,125,110,.25)}
.slabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);max-width:340px;margin:0 auto 26px}
.qback{background:none;border:none;color:var(--text-3);font-size:13px;cursor:pointer;padding:6px 12px;border-radius:6px}
.qback:hover{color:var(--text)}
.qback:disabled{opacity:0;pointer-events:none}
.khint{font-size:12px;color:var(--text-3);margin-top:14px;opacity:.55}

/* ---------- Results ---------- */
.res-wrap{max-width:620px;margin:0 auto;padding:44px 24px 90px}
.res-head{text-align:center;margin-bottom:8px}
.res-head h2{font-size:clamp(24px,5vw,30px);font-weight:700;line-height:1.2}
.res-sub{text-align:center;font-size:14px;color:var(--text-2);margin-bottom:36px}
.rscale{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px 26px;
  margin-bottom:20px;box-shadow:var(--shadow-sm)}
.rscale-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.rscale-head h3{font-size:19px;font-weight:700}
.rscale-head .en{font-size:12px;color:var(--text-3)}
.rscale-cite{font-size:11.5px;color:var(--text-3);margin-bottom:18px;line-height:1.5}
.radar-box{display:flex;justify-content:center;margin:6px 0 18px}
.radar-box svg{width:100%;max-width:330px;height:auto}
.verdict{text-align:center;font-size:14px;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-weight:500;line-height:1.5}
.fac{margin-bottom:18px}
.fac:last-child{margin-bottom:0}
.fac-top{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.fac-name{font-size:15px;font-weight:600}
.fac-en{font-size:11.5px;color:var(--text-3)}
.fac-lvl{margin-left:auto;font-size:12px;font-weight:600;padding:1px 9px;border-radius:5px}
.fac-track{height:7px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:5px}
.fac-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.fac-num{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-bottom:7px}
.fac-desc{font-size:13.5px;color:var(--text-2);line-height:1.62}

.export{margin-top:38px;text-align:center;background:var(--surface-2);border:1px solid var(--border-2);
  border-radius:var(--r);padding:28px 24px}
.export h3{font-size:16px;font-weight:600;margin-bottom:6px}
.export p{font-size:13px;color:var(--text-3);margin-bottom:20px;max-width:420px;margin-left:auto;margin-right:auto}
.export-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.obtn{padding:10px 18px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);
  font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;font-family:inherit}
.obtn:hover{border-color:var(--accent);color:var(--accent)}
.obtn svg{width:16px;height:16px}
.res-foot{display:flex;gap:12px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.disclaimer{margin-top:34px;padding-top:20px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);
  text-align:center;line-height:1.7;max-width:500px;margin-left:auto;margin-right:auto}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);
  color:var(--bg);padding:11px 22px;border-radius:9px;font-size:14px;font-weight:500;opacity:0;
  transition:opacity .3s,transform .3s;z-index:200;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .view{display:none!important}#v-res{display:block!important}
  .export,.res-foot,.khint{display:none!important}
  body{background:#fff}.rscale{break-inside:avoid;box-shadow:none}
}
@media(max-width:480px){.rbtn{min-width:44px;height:46px;font-size:15px}.rrow{gap:7px}}
</style>

<div id="app">
  <!-- CATALOG -->
  <section id="v-cat" class="view on">
    <div class="cat-header">
      <h1 class="serif">选择你想做的测评</h1>
      <p>勾选一个或多个心理测量量表，连续作答，获得可视化结果并导出你的作答数据。</p>
      <p class="cat-note" id="catNote"></p>
    </div>
    <div class="wrap"><div class="grid" id="grid"></div></div>
    <div class="dockbar">
      <div class="dock-info">已选 <b id="selCount">0</b> 个量表 · 共 <b id="selItems">0</b> 题 · 约 <b id="selTime">0</b> 分钟</div>
      <div class="dock-actions">
        <button class="link-btn" id="selAllBtn" onclick="toggleAll()">全选</button>
        <button class="btn" id="startBtn" onclick="startBattery()" disabled>开始测评</button>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="v-quiz" class="view">
    <div class="quiz-wrap">
      <div class="qbar">
        <div class="qbar-top">
          <span class="qbar-scale" id="qScale"></span>
          <span class="qbar-count" id="qCount"></span>
        </div>
        <div class="ptrack"><div class="pfill" id="qFill"></div></div>
        <div class="seg-dots" id="segDots"></div>
      </div>
      <div class="item-area">
        <div class="icard" id="icard">
          <div class="inum" id="qNum"></div>
          <div class="izh" id="qZh"></div>
          <div class="ien" id="qEn"></div>
          <div class="rrow" id="rrow"></div>
          <div class="slabels" id="slabels"></div>
          <button class="qback" id="qBack" onclick="prevItem()">&#8592; 上一题</button>
          <div class="khint" id="khint"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="v-res" class="view">
    <div class="res-wrap">
      <div class="res-head"><h2 class="serif">测评结果</h2></div>
      <p class="res-sub" id="resSub"></p>
      <div id="resCards"></div>
      <div class="export">
        <h3>导出作答数据</h3>
        <p>导出全部题目的原始作答与计分结果，可用于个人记录、研究分析或再次核对。</p>
        <div class="export-btns">
          <button class="obtn" onclick="exportData('json')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>导出 JSON</button>
          <button class="obtn" onclick="exportData('csv')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>导出 CSV</button>
          <button class="obtn" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>打印报告</button>
        </div>
      </div>
      <div class="res-foot">
        <button class="btn ghost" onclick="backToCatalog()">重选量表</button>
      </div>
      <div class="disclaimer" id="disclaimer"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

const CAT_LABEL={trait:'特质/大五',self:'自我/自尊',dark:'黑暗人格',positive:'积极心理',bio:'气质/生物'};
const CAT_VAR={trait:'--c-trait',self:'--c-self',dark:'--c-dark',positive:'--c-positive',bio:'--c-bio'};
const ORDER=['ipip','rses','gse','scc','ds14','brs','grits'];

/* ---------- state ---------- */
let selected=new Set();
let battery=[];          // [{sid, itemIdx}] flat sequence
let answers={};          // sid -> array of raw responses
let cur=0;
let t0=null;
let dlApi=null;

function gc(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0)}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}

/* ---------- catalog ---------- */
function renderCatalog(){
  const g=document.getElementById('grid');
  g.innerHTML=ORDER.map(sid=>{
    const s=SCALES[sid];const c=gc(CAT_VAR[s.cat]);
    const mins=Math.max(1,Math.round(s.items.length*0.12));
    const on=selected.has(sid);
    return `<div class="scard ${on?'sel':''}" data-sid="${sid}" onclick="toggleScale('${sid}')">
      <span class="chk"><svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></span>
      <span class="cat-tag" style="background:${c}22;color:${c}">${CAT_LABEL[s.cat]}</span>
      <h3>${s.zh}</h3><div class="en">${s.en}</div>
      <div class="blurb">${s.blurb}</div>
      <div class="meta"><span><b>${s.items.length}</b> 题</span><span>约 <b>${mins}</b> 分钟</span></div>
    </div>`;
  }).join('');
  document.getElementById('catNote').textContent=`当前可在线作答 ${ORDER.length} 个量表，均取自公共领域或学术公开、题项经核实的心理测量工具。结果仅供自我了解，不构成临床诊断。`;
  updateDock();
}
function toggleScale(sid){selected.has(sid)?selected.delete(sid):selected.add(sid);
  document.querySelector(`.scard[data-sid="${sid}"]`).classList.toggle('sel',selected.has(sid));updateDock()}
function toggleAll(){selected.size===ORDER.length?selected.clear():ORDER.forEach(s=>selected.add(s));renderCatalog()}
function updateDock(){
  let n=0;selected.forEach(s=>n+=SCALES[s].items.length);
  document.getElementById('selCount').textContent=selected.size;
  document.getElementById('selItems').textContent=n;
  document.getElementById('selTime').textContent=Math.max(1,Math.round(n*0.12));
  document.getElementById('startBtn').disabled=selected.size===0;
  document.getElementById('selAllBtn').textContent=selected.size===ORDER.length?'取消全选':'全选';
}

/* ---------- battery ---------- */
function startBattery(){
  battery=[];answers={};answeredSet.clear();
  ORDER.filter(s=>selected.has(s)).forEach(sid=>{
    answers[sid]=new Array(SCALES[sid].items.length).fill(0);
    SCALES[sid].items.forEach((_,i)=>battery.push({sid,i}));
  });
  cur=0;t0=Date.now();show('v-quiz');renderItem();
}
function scaleBounds(sid){const s=SCALES[sid];return {sid,s}}
function renderItem(){
  const {sid,i}=battery[cur];const s=SCALES[sid];const it=s.items[i];
  // segment dots per scale
  const sids=ORDER.filter(x=>selected.has(x));
  document.getElementById('segDots').innerHTML=sids.map(x=>{
    const done=SCALES[x].items.every((_,ii)=>isAnswered(x,ii));const isCur=x===sid;
    return `<span class="seg-dot ${done?'done':''} ${isCur?'cur':''}"></span>`;
  }).join('');
  document.getElementById('qScale').textContent=s.zh;
  // count within scale
  const within=i+1,total=s.items.length;
  document.getElementById('qCount').textContent=`${within} / ${total}`;
  document.getElementById('qNum').textContent=`总进度 ${cur+1} / ${battery.length}`;
  document.getElementById('qZh').textContent=it[0];
  document.getElementById('qEn').textContent=it[1];
  document.getElementById('qFill').style.width=((cur/battery.length)*100)+'%';
  document.getElementById('qBack').disabled=cur===0;
  // rating buttons adapt to scale points
  const row=document.getElementById('rrow');row.innerHTML='';
  const raw=answers[sid][i];const answered=isAnswered(sid,i);
  for(let p=0;p<s.pts;p++){
    const val=s.base+p;
    const b=document.createElement('button');
    b.className='rbtn'+(answered&&raw===val?' sel':'');
    b.textContent=val;
    b.title=s.anchors[p]||'';
    b.onclick=()=>answer(val);
    row.appendChild(b);
  }
  document.getElementById('slabels').innerHTML=`<span>${s.ends[0]}</span><span>${s.ends[1]}</span>`;
  document.getElementById('khint').textContent=`键盘 ${s.base===0?s.base+'-'+(s.base+s.pts-1):'1-'+s.pts} 选择 · ← 返回`;
}
function answer(val){
  const {sid,i}=battery[cur];
  answers[sid][i]=val;answeredMark(sid,i);
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('sel',+b.textContent===val));
  if(cur<battery.length-1){
    setTimeout(()=>{const c=document.getElementById('icard');c.classList.add('mv');
      setTimeout(()=>{cur++;renderItem();c.classList.remove('mv')},200)},240);
  }else{
    document.getElementById('qFill').style.width='100%';
    setTimeout(showResults,420);
  }
}
// track answered items (handles base-0 where value 0 is valid)
const answeredSet=new Set();
function answeredMark(sid,i){answeredSet.add(sid+'#'+i)}
function isAnswered(sid,i){return answeredSet.has(sid+'#'+i)}
function prevItem(){if(cur<=0)return;const c=document.getElementById('icard');c.classList.add('mvb');
  setTimeout(()=>{cur--;renderItem();c.classList.remove('mvb')},200)}

/* ---------- scoring ---------- */
function scoreScale(sid){
  const s=SCALES[sid];const resp=answers[sid];
  const hi=s.base+s.pts-1;
  const facSums={},facCounts={};
  s.facs.forEach(f=>{facSums[f.k]=0;facCounts[f.k]=0});
  const detail=[];
  s.items.forEach((it,idx)=>{
    const raw=resp[idx];
    const scored=it[3]?((s.base+hi)-raw):raw;
    facSums[it[2]]+=scored;facCounts[it[2]]++;
    detail.push({item:idx+1,zh:it[0],factor:it[2],key:it[3]?'-':'+',raw,scored});
  });
  const facs=s.facs.map(f=>{
    const cnt=facCounts[f.k],sum=facSums[f.k];
    const min=cnt*s.base,max=cnt*hi;
    const pct=max>min?Math.round((sum-min)/(max-min)*100):0;
    const lvl=pct>=67?2:(pct>=34?1:0);
    return {k:f.k,zh:f.zh,en:f.en,sum,min,max,cnt,mean:+(sum/cnt).toFixed(2),pct,lvl,desc:f.d[2-lvl]};
  });
  return {sid,facs,detail};
}
function levelLabel(l){return ['偏低','中等','偏高'][l]}
function levelColor(l){return [gc('--f1'),gc('--f3'),gc('--f0')][l]}

/* ---------- results ---------- */
function showResults(){
  const dur=Math.round((Date.now()-t0)/1000);
  const m=Math.floor(dur/60),sec=dur%60;
  const sids=ORDER.filter(x=>selected.has(x));
  document.getElementById('resSub').textContent=`完成 ${sids.length} 个量表 · 共 ${battery.length} 题 · 用时 ${m} 分 ${sec} 秒`;
  const box=document.getElementById('resCards');
  box.innerHTML=sids.map(sid=>renderScaleResult(sid)).join('');
  sids.forEach(sid=>{const sc=scoreScale(sid);if(sc.facs.length>=3)drawRadar(sid,sc)});
  document.getElementById('disclaimer').innerHTML=
    '本平台题目取自公共领域或学术公开、题项经逐条核实的心理测量工具，仅供个人自我了解与教育用途，<b>不构成心理或医学诊断</b>。如有困扰请咨询专业人士。';
  show('v-res');initDl();
}
function renderScaleResult(sid){
  const s=SCALES[sid];const sc=scoreScale(sid);
  let inner='';
  if(sc.facs.length>=3){
    inner+=`<div class="radar-box"><svg id="radar-${sid}" viewBox="0 0 340 320"></svg></div>`;
  }
  // Type D verdict
  if(s.special==='typeD'){
    const na=sc.facs.find(f=>f.k==='NA').sum,si=sc.facs.find(f=>f.k==='SI').sum;
    const isD=na>=10&&si>=10;
    const col=isD?gc('--c-dark'):gc('--c-positive');
    inner+=`<div class="verdict" style="background:${col}1a;color:${col}">${isD
      ?'判定：D型人格倾向（消极情感 ≥10 且 社交抑制 ≥10）。这是一种应对倾向的描述，非疾病诊断。'
      :'判定：非D型人格（未同时满足两维度 ≥10 的标准）。'}</div>`;
  }
  inner+=sc.facs.map((f,idx)=>{
    const c=sc.facs.length>=3?gc('--f'+(idx%5)):levelColor(f.lvl);
    return `<div class="fac">
      <div class="fac-top"><span class="fac-name">${f.zh}</span><span class="fac-en">${f.en}</span>
        <span class="fac-lvl" style="background:${levelColor(f.lvl)}1f;color:${levelColor(f.lvl)}">${levelLabel(f.lvl)}</span></div>
      <div class="fac-track"><div class="fac-fill" style="width:${f.pct}%;background:${c}"></div></div>
      <div class="fac-num">${f.sum} / ${f.max}　（${f.pct}%${s.facs.length>1||s.pts>4?'　均值 '+f.mean:''}）</div>
      <div class="fac-desc">${f.desc}</div>
    </div>`;
  }).join('');
  return `<div class="rscale">
    <div class="rscale-head"><h3>${s.zh}</h3><span class="en">${s.en}</span></div>
    <div class="rscale-cite">${s.cite}</div>
    ${inner}
  </div>`;
}
function drawRadar(sid,sc){
  const svg=document.getElementById('radar-'+sid);if(!svg)return;
  const n=sc.facs.length,cx=170,cy=160,R=105;
  const ang=i=>(i*2*Math.PI/n)-Math.PI/2;
  let h='';
  [.25,.5,.75,1].forEach(p=>{
    const pts=sc.facs.map((_,i)=>`${cx+R*p*Math.cos(ang(i))},${cy+R*p*Math.sin(ang(i))}`).join(' ');
    h+=`<polygon points="${pts}" fill="none" stroke="${gc('--border')}" stroke-width="${p===1?1.2:.5}"/>`;
  });
  sc.facs.forEach((_,i)=>{h+=`<line x1="${cx}" y1="${cy}" x2="${cx+R*Math.cos(ang(i))}" y2="${cy+R*Math.sin(ang(i))}" stroke="${gc('--border')}" stroke-width=".5"/>`});
  const dp=sc.facs.map((f,i)=>[cx+R*(f.pct/100)*Math.cos(ang(i)),cy+R*(f.pct/100)*Math.sin(ang(i))]);
  h+=`<polygon points="${dp.map(p=>p.join(',')).join(' ')}" fill="${gc('--accent-bg')}" stroke="${gc('--accent')}" stroke-width="2" stroke-linejoin="round"/>`;
  dp.forEach(([x,y],i)=>{h+=`<circle cx="${x}" cy="${y}" r="4" fill="${gc('--f'+(i%5))}" stroke="${gc('--surface')}" stroke-width="2"/>`});
  const lR=R+22;
  sc.facs.forEach((f,i)=>{const a=ang(i);const lx=cx+lR*Math.cos(a),ly=cy+lR*Math.sin(a);
    const anc=Math.abs(Math.cos(a))<.2?'middle':(Math.cos(a)>0?'start':'end');
    const dy=Math.sin(a)<-.3?-4:(Math.sin(a)>.3?12:4);
    h+=`<text x="${lx}" y="${ly+dy}" text-anchor="${anc}" fill="${gc('--f'+(i%5))}" font-size="12" font-weight="600" font-family="Inter,sans-serif">${f.zh}</text>`;
    h+=`<text x="${lx}" y="${ly+dy+14}" text-anchor="${anc}" fill="${gc('--text-3')}" font-size="10.5" font-family="Inter,sans-serif">${f.pct}%</text>`;
  });
  svg.innerHTML=h;
}

/* ---------- export ---------- */
function buildData(){
  const sids=ORDER.filter(x=>selected.has(x));
  return {
    platform:'人格测评平台',
    timestamp:new Date().toISOString(),
    duration_seconds:Math.round((Date.now()-t0)/1000),
    scales:sids.map(sid=>{
      const s=SCALES[sid];const sc=scoreScale(sid);
      return {
        id:sid,name:s.zh,name_en:s.en,response_points:s.pts+'('+s.base+'-'+(s.base+s.pts-1)+')',
        responses:sc.detail,
        scores:sc.facs.map(f=>({factor:f.k,name:f.zh,sum:f.sum,max:f.max,mean:f.mean,pct:f.pct,level:levelLabel(f.lvl)})),
        type_d: s.special==='typeD' ? (sc.facs.find(f=>f.k==='NA').sum>=10 && sc.facs.find(f=>f.k==='SI').sum>=10) : undefined
      };
    })
  };
}
function buildCSV(){
  const sids=ORDER.filter(x=>selected.has(x));
  let csv='scale,item,text_zh,factor,key,response,scored\n';
  sids.forEach(sid=>{const sc=scoreScale(sid);sc.detail.forEach(d=>{
    csv+=`${sid},${d.item},"${d.zh}",${d.factor},${d.key},${d.raw},${d.scored}\n`;});});
  csv+='\nscale,factor,name,sum,max,mean,pct,level\n';
  sids.forEach(sid=>{const sc=scoreScale(sid);sc.facs.forEach(f=>{
    csv+=`${sid},${f.k},${f.zh},${f.sum},${f.max},${f.mean},${f.pct},${levelLabel(f.lvl)}\n`;});});
  return csv;
}
async function initDl(){try{if(window.claude&&claude.use)dlApi=await claude.use('downloads')}catch(e){dlApi=null}}
async function saveFile(filename,data,mime){
  if(dlApi){try{await dlApi.save({filename,data});return true}catch(e){}}
  try{const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);return true}catch(e){}
  try{await navigator.clipboard.writeText(data);toast('已复制到剪贴板');return true}catch(e){toast('导出失败');return false}
}
function exportData(fmt){
  const json=fmt==='json';
  const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  saveFile(`测评结果-${stamp}.${json?'json':'csv'}`, json?JSON.stringify(buildData(),null,2):buildCSV(), json?'application/json':'text/csv;charset=utf-8');
}

/* ---------- nav ---------- */
function backToCatalog(){answeredSet.clear();show('v-cat')}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('v-quiz').classList.contains('on'))return;
  const {sid}=battery[cur];const s=SCALES[sid];
  const num=parseInt(e.key,10);
  if(!isNaN(num)&&num>=s.base&&num<=s.base+s.pts-1){e.preventDefault();answer(num)}
  if(e.key==='ArrowLeft'){e.preventDefault();prevItem()}
});
const mo=new MutationObserver(()=>{if(document.getElementById('v-res').classList.contains('on')){
  ORDER.filter(x=>selected.has(x)).forEach(sid=>{const sc=scoreScale(sid);if(sc.facs.length>=3)drawRadar(sid,sc)});}});
mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{
  if(document.getElementById('v-res').classList.contains('on'))ORDER.filter(x=>selected.has(x)).forEach(sid=>{const sc=scoreScale(sid);if(sc.facs.length>=3)drawRadar(sid,sc)});})}catch(e){}

renderCatalog();
</script>
